notes: >-
  MATERIAL FINDING — the public website of Nirmidas Biotech cannot be reached by a standards-compliant
  HTTPS client. The leaf certificate served on www.nirmidas.com and nirmidas.com expired on 2026-06-20
  and was still being served on 2026-08-26, so every browser and every automated client presents or
  raises a certificate error before any content is delivered. Every probe recorded in this repository
  therefore had to disable certificate verification. Compounding it, the issuing CA is WoTrus CA Limited
  (the successor of WoSign), whose roots are distrusted by the major browser trust stores — so even a
  freshly reissued certificate from the same chain would not validate. The hosting is Alibaba/Wanwang
  (www.nirmidas.com resolves via wh-au3su8zmnldkkubdddb.my3w.com to 198.11.174.219). No HSTS header is
  served, DNSSEC is not enabled, no CAA records are published, and there is no DMARC record; an SPF
  record is present.
