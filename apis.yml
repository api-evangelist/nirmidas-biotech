aid: nirmidas-biotech
name: Nirmidas Biotech
description: >-
  Nirmidas Biotech, Inc. is a Mountain View, California life-science company founded in September 2013
  that develops and manufactures diagnostics and imaging products built on near-infrared (NIR)
  fluorescence enhancement. Its patented plasmonic gold (pGOLD) assay platform boosts biological
  detection signals on gold-coated microarray slides and 96-well microplates, and is paired with the
  MidaScan and MidaScan-IR confocal scanners, MidaSpot rapid antibody test kits, and the DeepVision,
  KingsVision, SockEye and AlbertSurgical in vivo NIR-I / NIR-II / SWIR imaging systems, plus a catalog
  of NIR-II dyes and probes. The company is a member of Janssen Labs (JLABS), QB3, Stanford StartX Med
  and the MIT Industrial Liaison Program, manufactures under ISO 13485:2016, and received FDA Emergency
  Use Authorization for its MidaSpot COVID-19 antibody fingerstick test. Products are sold as physical
  instruments, kits and reagents through an inquiry-based storefront; Nirmidas publishes no developer
  program, no public API, and no machine-readable API contract.
